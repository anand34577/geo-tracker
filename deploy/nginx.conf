# nginx site for GeoTracker. Certificates via certbot (or your own).
server {
    listen 443 ssl;
    http2 on;
    server_name track.example.com;

    ssl_certificate     /etc/letsencrypt/live/track.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.example.com/privkey.pem;

    client_max_body_size 8g;          # large Google Takeout imports

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;  # required: cross-origin protection compares Origin with Host
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;  # stream uploads to disk instead of buffering them twice
    }

    location /api/v1/live {           # Server-Sent Events
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name track.example.com;
    return 301 https://$host$request_uri;
}
