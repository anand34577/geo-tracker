name: Release

# Pushing a tag like v0.1.0 builds standalone binaries for every platform and a signed
# Android APK, and attaches them to a GitHub Release. The Docker image is published by
# ci.yml on the same tag. The APK is signed with the ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets; the
# release fails rather than ship an unsigned app.
#
# Actions are pinned to commit SHAs (the comment keeps the version readable): the
# signing jobs load the Android keystore, so a moved or hijacked tag must not change
# what runs here. Only the release-publishing job may write to the repository.
on:
  push:
    tags: ["v*"]

jobs:
  web:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: lts/*, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: web-dist, path: web/dist, retention-days: 1 }

  binaries:
    needs: web
    runs-on: ubuntu-latest
    permissions: { contents: read }
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64,             name: geotracker-linux-amd64 }
          - { goos: linux,   goarch: arm64,             name: geotracker-linux-arm64 }
          - { goos: linux,   goarch: arm, goarm: "7",   name: geotracker-linux-armv7 }
          - { goos: darwin,  goarch: arm64,             name: geotracker-darwin-arm64 }
          - { goos: darwin,  goarch: amd64,             name: geotracker-darwin-amd64 }
          - { goos: windows, goarch: amd64,             name: geotracker-windows-amd64.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: web-dist, path: web/dist }
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/${{ matrix.name }}" ./cmd/geotracker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: "${{ matrix.name }}", path: "dist/${{ matrix.name }}", retention-days: 1 }

  android:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for s in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::Android signing secret for $s is not set"; exit 1; }
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # v1.2.3(-rc1) → versionName 1.2.3(-rc1), versionCode 10203 (must grow with every release).
          v="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${v%%-*}"
          ./gradlew testReleaseUnitTest assembleRelease -PversionName="$v" -PversionCode=$((major * 10000 + minor * 100 + patch))
      - name: Verify signature
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          mkdir -p dist && cp "$apk" "dist/geotracker-android-${GITHUB_REF_NAME#v}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: geotracker-android, path: dist/*.apk, retention-days: 1 }

  release:
    needs: [binaries, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { path: dist, pattern: geotracker-*, merge-multiple: true }
      - name: Checksums
        working-directory: dist
        run: sha256sum geotracker-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp scripts/install.sh dist/install.sh
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "GeoTracker ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "Install: see the [wiki](https://github.com/${{ github.repository }}/wiki). Linux one-liner: \`curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo sh\`. Android: install \`geotracker-android-${GITHUB_REF_NAME#v}.apk\` below."
