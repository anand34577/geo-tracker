name: Publish wiki

# The wiki is generated from docs/ so documentation changes go through normal review.
# One-time setup: create any page in the repo's Wiki tab so the wiki repository exists.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync docs/ to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/ wiki/
          cd wiki
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Sync docs from ${GITHUB_SHA::7}" && git push; }
